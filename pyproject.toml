[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "session-checkpoint"
version = "0.1.0"
description = "Local, application-neutral session checkpoint storage with integrity checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ellmos-ai contributors" }]
keywords = ["session", "checkpoint", "sqlite", "local-first"]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7",
  "ruff>=0.12",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=6",
]

[project.urls]
Repository = "https://github.com/ellmos-ai/session-checkpoint"
Issues = "https://github.com/ellmos-ai/session-checkpoint/issues"

[project.scripts]
session-checkpoint = "session_checkpoint.cli:main"

[tool.setuptools.packages.find]
include = ["session_checkpoint*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
