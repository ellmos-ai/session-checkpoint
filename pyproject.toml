[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "session-checkpoint"
version = "0.1.1"
description = "Local, application-neutral session checkpoint storage with integrity checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ellmos-ai contributors" }]
keywords = ["session", "checkpoint", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7",
  "ruff>=0.12",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/session-checkpoint"
Documentation = "https://github.com/ellmos-ai/session-checkpoint#readme"
Repository = "https://github.com/ellmos-ai/session-checkpoint"
Issues = "https://github.com/ellmos-ai/session-checkpoint/issues"
Changelog = "https://github.com/ellmos-ai/session-checkpoint/blob/main/CHANGELOG.md"

[project.scripts]
session-checkpoint = "session_checkpoint.cli:main"

[tool.setuptools.packages.find]
include = ["session_checkpoint*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
