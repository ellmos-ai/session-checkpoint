<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0f1f42"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="glow-checkpoint" cx="300" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060c18" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  
  
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="300" cy="170" r="260" fill="url(#glow-checkpoint)"/>
    
    <!-- Checkpoint Timeline & Bookmark Disk -->
    <g transform="translate(170, 70)">
      <!-- Timeline Track -->
      <line x1="20" y1="100" x2="180" y2="100" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Checkpoint Nodes -->
      <circle cx="40" cy="100" r="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="90" cy="100" r="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="150" cy="100" r="16" fill="#2563eb" stroke="#93c5fd" stroke-width="3"/>
      
      <!-- Flag / Bookmark at active checkpoint -->
      <path d="M150 50 L150 84 M150 50 L180 62 L150 74" fill="#38bdf8" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Rewind loop indicator -->
      <path d="M130 135 A 30 30 0 1 1 165 125" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="125,130 135,135 128,145" fill="#60a5fa"/>
    </g>
    
  
    <g transform="translate(480, 0)">
      <g transform="translate(0, 58)">
        <rect width="190" height="26" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
        <text x="95" y="17" text-anchor="middle" class="badge-text" fill="#bfdbfe">STATE &amp; PERSISTENCE</text>
      </g>
      
      <text x="0" y="142" class="title" font-size="52" fill="url(#title-grad)">session-checkpoint</text>
      
      <text x="0" y="184" class="subtitle" font-size="20" fill="#dbeafe">Zero-Friction State Snapshotting &amp; Session Resumption</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#94a3b8" opacity="0.8">Application-neutral, deterministic checkpoint engine for AI agents and CLI workflows.</text>
      
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bfdbfe">💾 State Snapshots</text>
        </g>
        <g transform="translate(157, 0)">
          <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bfdbfe">⏪ Instant Resume</text>
        </g>
        <g transform="translate(314, 0)">
          <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bfdbfe">⚡ Fast &amp; Portable</text>
        </g>
      </g>
    </g>
    
</svg>